name: Update flake inputs
description: Generate an app token, check out, install Nix, update the flake inputs and build it

inputs:
  client-id:
    description: Client ID of the GitHub app used to check out and push
    required: true
  private-key:
    description: Private key of the GitHub app used to check out and push
    required: true
  package:
    description: Flake package to build
    required: false
    default: ""

outputs:
  token:
    description: App token, for passing to the commit-lock action
    value: ${{ steps.app-token.outputs.token }}

runs:
  using: composite

  steps:
    - name: Generate app token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}

    - uses: actions/checkout@v7
      with:
        token: ${{ steps.app-token.outputs.token }}

    - name: Install Nix
      uses: nixbuild/nix-quick-install-action@v34
      with:
        nix_conf: |
          keep-env-derivations = true
          keep-outputs = true

    - name: Restore and save Nix store
      uses: nix-community/cache-nix-action@v7
      with:
        # restore and save a cache using this key
        primary-key: nix-${{ hashFiles('**/*.nix', '**/flake.lock') }}
        # if there's no cache hit, restore a cache by this prefix
        restore-prefixes-first-match: nix-
        # collect garbage until the Nix store size (in bytes) is at most this number
        # before trying to save a new cache
        # 1G = 1073741824
        gc-max-store-size-linux: 1G
        # do purge caches
        purge: true
        # purge all versions of the cache
        purge-prefixes: nix-
        # created more than this number of seconds ago
        purge-created: 0
        # or, last accessed more than this number of seconds ago
        # relative to the start of the `Post Restore and save Nix store` phase
        purge-last-accessed: 0
        # except any version with the key that is the same as the `primary-key`
        purge-primary-key: never

    - name: Update flake inputs
      shell: bash
      run: nix flake update

    - name: Attempt to build flake
      shell: bash
      run: nix build ${{ inputs.package != '' && format('.#{0}', inputs.package) || '' }}
